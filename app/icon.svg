<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 120 120"
  width="120"
  height="120"
>
  <title>Alpi — AI Growth Coach</title>

  <!-- Warm background -->
  <circle cx="60" cy="60" r="60" fill="#FAF8F5"/>

  <!-- Soft aura -->
  <circle cx="60" cy="60" r="48" fill="#FEF3C7" opacity="0.45"/>

  <!-- Left ear -->
  <path
    d="M42 43C36 33 35 17 42 11C48 7 52 20 48 37"
