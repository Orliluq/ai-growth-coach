    <!-- Right frame -->
    <circle
      cx="74"
      cy="58"
      r="11"
      fill="#FFFFFF"
      fill-opacity="0.35"
    />

    <!-- Arms -->
    <path
      d="M35 57L30 54"
      stroke-linecap="round"
    />

    <path
      d="M85 57L90 54"
      stroke-linecap="round"
    />
  </g>

  <!-- Eyes -->
  <circle cx="46" cy="58" r="3.6" fill="#18181B"/>
  <circle cx="74" cy="58" r="3.6" fill="#18181B"/>

  <!-- Eye highlights -->
  <circle cx="45" cy="56.5" r="1.2" fill="#FFFFFF"/>
  <circle cx="73" cy="56.5" r="1.2" fill="#FFFFFF"/>

  <!-- Blush -->
  <ellipse
