    stroke="#E5DFD5"
    stroke-width="2.5"
  />

  <path
    d="M78 36C82 28 82 19 78 15C75 13 73 22 75 33"
    fill="#FDE8E8"
  />

  <!-- Head -->
  <ellipse
    cx="60"
    cy="57"
    rx="35"
    ry="34"
    fill="#FAF6F0"
    stroke="#E5DFD5"
    stroke-width="2.8"
  />

  <!-- Fluffy crown -->
  <path
